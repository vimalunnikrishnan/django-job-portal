
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Test Mode</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f7fb;
        }
        main {
            background: white;
            padding: 24px;
            border-radius: 12px;
        }
        textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 12px;
        }
        textarea {
            min-height: 110px;
        }
        button {
            cursor: pointer;
            background: #1769aa;
            color: white;
            border: 0;
            border-radius: 6px;
        }
        #status {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
<main>
    <h2>Razorpay Test Checkout</h2>
    <p>PRO subscription — ₹999.00 INR</p>

    <label for="token">Employer JWT access token</label>
    <textarea id="token"
        placeholder="Paste your access token from Postman here"></textarea>

    <button id="payButton" onclick="startPayment()">
        Pay ₹999 (Test Mode)
    </button>

    <p id="status" role="status">Ready for testing.</p>
</main>

<script>
async function startPayment() {
    const token = document.getElementById("token").value.trim();
    const statusBox = document.getElementById("status");
    const button = document.getElementById("payButton");

    if (!token) {
        statusBox.textContent = "Please enter your employer access token.";
        return;
    }

    button.disabled = true;

    try {
        statusBox.textContent = "Creating Razorpay test order...";

        const orderResponse = await fetch("/api/billing/create-order/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ plan_id: 2 })
        });

        const orderResult = await orderResponse.json();

        if (!orderResponse.ok || !orderResult.success) {
            throw new Error(orderResult.message || "Order creation failed.");
        }

        const order = orderResult.data;

        const options = {
            key: order.razorpay_key_id,
            amount: order.amount,
            currency: order.currency,
            name: "Django Job Portal",
            description: "PRO subscription - Test Mode",
            order_id: order.razorpay_order_id,

            handler: async function (payment) {
                statusBox.textContent =
                    "Payment completed by Checkout. Verifying with server...";

                try {
                    const verifyResponse = await fetch(
                        "/api/billing/verify-payment/",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": "Bearer " + token
                            },
                            body: JSON.stringify({
                                razorpay_order_id: payment.razorpay_order_id,
                                razorpay_payment_id: payment.razorpay_payment_id,
                                razorpay_signature: payment.razorpay_signature
                            })
                        }
                    );

                    const verifyResult = await verifyResponse.json();

                    if (!verifyResponse.ok || !verifyResult.success) {
                        throw new Error(
                            verifyResult.message || "Payment verification failed."
                        );
                    }

                    statusBox.textContent =
                        "SUCCESS: Payment verified and subscription activated. " +
                        JSON.stringify(verifyResult.data || verifyResult);
                } catch (error) {
                    statusBox.textContent =
                        "Verification error: " + error.message;
                } finally {
                    button.disabled = false;
                }
            },

            modal: {
                ondismiss: function () {
                    statusBox.textContent =
                        "Checkout closed. Check payment status before retrying.";
                    button.disabled = false;
                }
            },

            theme: {
                color: "#1769aa"
            }
        };
        const checkout = new Razorpay(options);
        checkout.on("payment.failed", function (response) {
            const error = response.error || {};
            statusBox.textContent =
                "Test payment failed.\n" +
                "Code: " + (error.code || "Not provided") + "\n" +
                "Description: " + (error.description || "Unknown error") + "\n" +
                "Reason: " + (error.reason || "Not provided") + "\n" +
                "Source: " + (error.source || "Not provided");

            button.disabled = false;
        });


        checkout.open();

    } catch (error) {
        statusBox.textContent = "Error: " + error.message;
        button.disabled = false;
    }
}
</script>
</body>
</html>
