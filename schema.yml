components:
  schemas:
    AIAnswerEvaluation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer:
          type: integer
          readOnly: true
        relevance_score:
          type: number
          format: double
          readOnly: true
        completeness_score:
          type: number
          format: double
          readOnly: true
        keyword_score:
          type: number
          format: double
          readOnly: true
        overall_score:
          type: number
          format: double
          readOnly: true
        confidence:
          type: number
          format: double
          readOnly: true
        ai_annotations:
          readOnly: true
        feedback:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_annotations
      - answer
      - completeness_score
      - confidence
      - created_at
      - feedback
      - id
      - keyword_score
      - overall_score
      - relevance_score
      - updated_at
    AdminBillingHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subscription:
          type: integer
          readOnly: true
        employer_email:
          type: string
          format: email
          readOnly: true
        plan_name:
          type: string
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - description
      - employer_email
      - event_type
      - id
      - plan_name
      - subscription
    AdminFinancialAudit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        action:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - category
      - created_at
      - description
      - id
      - ip_address
      - metadata
      - target_id
      - target_type
    AdminPaymentTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subscription:
          type: integer
          readOnly: true
        employer_email:
          type: string
          format: email
          readOnly: true
        plan_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        refunded_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        provider:
          type: string
          readOnly: true
        provider_transaction_id:
          type: string
          readOnly: true
          nullable: true
        provider_order_id:
          type: string
          readOnly: true
          nullable: true
        failure_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - employer_email
      - failure_reason
      - id
      - plan_name
      - provider
      - provider_order_id
      - provider_transaction_id
      - refunded_amount
      - status
      - subscription
      - updated_at
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
