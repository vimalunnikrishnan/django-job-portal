openapi: 3.0.3
info:
  title: Django Job Portal API
  version: 1.0.0
  description: API documentation for the Django Job Portal.
paths:
  /api/admin-dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      description: Retrieve platform-wide user, job, and application statistics for
        administrators.
      summary: Retrieve the admin dashboard.
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_retrieve
      description: Retrieve administrator audit logs, including the admin, action,
        target user, target job, reason, and creation time.
      summary: Retrieve administrative audit logs.
      tags:
      - Admin Audit Logs
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/audit-trails/:
    get:
      operationId: admin_audit_trails_retrieve
      description: Retrieve the latest 100 audit trail records, including actor, category,
        action, description, metadata, IP address, and timestamp.
      summary: Retrieve system audit trail records.
      tags:
      - Admin Audit Logs
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/employers/{user_id}/approve/:
    patch:
      operationId: admin_employers_approve_partial_update
      description: Approve an employer profile using its user ID. Returns an error
        if the profile is not found or is already approved.
      summary: Approve an employer account.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Employer Management
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/job-activity/:
    get:
      operationId: admin_job_activity_retrieve
      description: Retrieve job activity statistics, including total, active, inactive,
        open, and closed jobs, with a breakdown by job type.
      summary: Retrieve job activity statistics.
      tags:
      - Admin Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/user-growth/:
    get:
      operationId: admin_user_growth_retrieve
      description: Retrieve daily user registration statistics, grouped by creation
        date.
      summary: Retrieve daily user growth statistics.
      tags:
      - Admin Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/users/{user_id}/block/:
    patch:
      operationId: admin_users_block_partial_update
      description: Block a user account using its user ID. An administrator cannot
        block their own account or block an account that is already blocked.
      summary: Block a user account.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - User Management
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/users/{user_id}/flag/:
    patch:
      operationId: admin_users_flag_partial_update
      description: Flag a user account using its user ID. An administrator cannot
        flag their own account or flag a user who is already flagged.
      summary: Flag a user account for administrative review.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - User Management
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/users/{user_id}/unblock/:
    patch:
      operationId: admin_users_unblock_partial_update
      description: Unblock a user account using its user ID. Returns an error if the
        user is not found or is already active.
      summary: Unblock a user account.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - User Management
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/admin/billing-history/:
    get:
      operationId: billing_admin_billing_history_list
      description: Retrieve billing history records with optional event type filtering.
      summary: Retrieve administrative billing history.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - billing
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminBillingHistoryList'
          description: ''
  /api/billing/admin/financial-audit/:
    get:
      operationId: billing_admin_financial_audit_list
      description: Retrieve financial audit records with optional category and action
        filters.
      summary: Retrieve financial audit records.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - billing
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminFinancialAuditList'
          description: ''
  /api/billing/admin/revenue/:
    get:
      operationId: billing_admin_revenue_retrieve
      description: Retrieve the platform revenue report, including gross revenue,
        total refunds, net revenue, daily revenue for the latest 30 entries, monthly
        revenue for the latest 12 entries, and plan-wise revenue.
      summary: Retrieve the administrative revenue report.
      tags:
      - Admin Revenue Reports
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/admin/transactions/:
    get:
      operationId: billing_admin_transactions_list
      description: Retrieve payment transactions for administrative review. Supports
        filtering by transaction status.
      summary: Retrieve payment transaction records.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - billing
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPaymentTransactionList'
          description: ''
  /api/billing/create-order/:
    post:
      operationId: billing_create_order_create
      description: Create a Razorpay payment order for an active paid subscription
        plan. Only authenticated employers can purchase subscriptions.
      summary: Create a Razorpay payment order.
      tags:
      - Billing & Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: integer
              required:
              - plan_id
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '502':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/razorpay/webhook/:
    post:
      operationId: billing_razorpay_webhook_create
      description: Receive and process Razorpay webhook events. Validates the webhook
        signature and handles captured payments, failed payments, and processed refunds.
        Duplicate events are ignored.
      summary: Process Razorpay payment webhook events.
      tags:
      - Billing & Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Razorpay webhook event payload.
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/subscription-status/:
    get:
      operationId: billing_subscription_status_retrieve
      description: Retrieve the authenticated employer's subscription status, plan
        limits, analytics access, and applicable grace-period details.
      summary: Retrieve the employer subscription status.
      tags:
      - Billing & Payments
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/verify-payment/:
    post:
      operationId: billing_verify_payment_create
      description: Verify a Razorpay payment using its order ID, payment ID, and signature.
        On successful verification, activate the subscription and record the payment.
      summary: Verify Razorpay payment and activate subscription.
      tags:
      - Billing & Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentVerification'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '502':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/candidate/:
    get:
      operationId: candidate_retrieve
      description: Retrieve the candidate dashboard with the authenticated user's
        ID, email, and role.
      summary: Retrieve the candidate dashboard.
      tags:
      - Candidate Dashboard
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/employer/:
    get:
      operationId: employer_retrieve
      description: Retrieve the employer dashboard with the authenticated user's ID,
        email, and role.
      summary: Retrieve the employer dashboard.
      tags:
      - Employer Dashboard
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/employer/profile/:
    post:
      operationId: employer_profile_create
      description: Create an employer profile for the authenticated employer.
      summary: Create or update the employer company profile.
      tags:
      - Employer Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployerProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployerProfile'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/:
    post:
      operationId: jobs_create
      description: Create a new job listing using the authenticated employer's account.
        Job creation is subject to subscription limits.
      summary: Create a new job posting.
      tags:
      - Job Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/:
    get:
      operationId: jobs_retrieve
      description: Retrieve the details of an active job posting using its ID.
      summary: Retrieve job posting details.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{id}/apply/:
    post:
      operationId: jobs_apply_create
      description: Apply for an active and open job using its ID. The candidate must
        have a profile and uploaded resume, and must not have already applied.
      summary: Submit an application for a job.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Job Applications
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/candidates/ranking/:
    get:
      operationId: jobs_candidates_ranking_retrieve
      description: Retrieve ranked candidates for an active job owned by the authenticated
        employer. Includes candidate details, application status, skill, experience
        and education scores, and match percentage. Subject to premium recruiter throttling
        and candidate-access limits.
      summary: Retrieve ranked candidates for a job.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Job Matching
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/delete/:
    delete:
      operationId: jobs_delete_destroy
      description: Deactivate an active job listing owned by the authenticated employer.
        This is a soft delete; the job record remains in the database.
      summary: Deactivate an existing job posting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Job Management
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/match/:
    get:
      operationId: jobs_match_retrieve
      description: Calculate the authenticated candidate's ATS match score for an
        active job listing and return the serialized score.
      summary: Calculate the candidate's job match percentage.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Job Matching
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/save/:
    post:
      operationId: jobs_save_create
      description: Save an active job listing to the authenticated candidate's saved
        jobs. Returns an error if the job is already saved.
      summary: Save a job posting to the candidate's saved jobs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Saved Jobs
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/unsave/:
    delete:
      operationId: jobs_unsave_destroy
      description: Remove a job from the authenticated candidate's saved jobs using
        the job ID.
      summary: Remove a job from the candidate's saved jobs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Saved Jobs
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/{id}/update/:
    put:
      operationId: jobs_update_update
      description: Update a job posting owned by the authenticated employer. Supports
        PUT and PATCH requests.
      summary: Update an existing job posting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    patch:
      operationId: jobs_update_partial_update
      description: Update a job posting owned by the authenticated employer. Supports
        PUT and PATCH requests.
      summary: Update an existing job posting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJob'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/admin/{id}/deactivate/:
    patch:
      operationId: jobs_admin_deactivate_partial_update
      description: Deactivate a job listing using its ID. Administrators must provide
        a moderation reason.
      summary: Deactivate a job posting through admin moderation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin Job Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                moderation_reason:
                  type: string
              required:
              - moderation_reason
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/ai-answers/{question_id}/evaluate/:
    post:
      operationId: jobs_ai_answers_evaluate_create
      description: Evaluate a candidate's AI interview answer using relevance, completeness,
        keyword matching, and confidence scoring.
      summary: Evaluate a candidate's AI interview answer.
      parameters:
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - AI Interviews
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer_text:
                  type: string
              required:
              - answer_text
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnswerEvaluation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/jobs/ai-answers/{question_id}/score/:
    get:
      operationId: jobs_ai_answers_score_retrieve
      description: Retrieve the AI evaluation scores for an interview answer, including
        relevance, completeness, keyword matching, overall score, and confidence.
      summary: Retrieve the evaluation score for an AI interview answer.
      parameters:
      - in: path
